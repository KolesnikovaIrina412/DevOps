name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Flake8
        run: flake8 . --max-line-length=120 --extend-ignore=E402 --exclude=.venv,tests/__pycache__,migrations
      - name: Run Bandit (SAST)
        run: bandit -r . -x ./.venv,./tests,./migrations -q

  test:
    runs-on: self-hosted
    needs: lint
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install --break-system-packages -r requirements.txt
      - name: Run Tests
        env:
          DATABASE_URL: postgresql+psycopg2://app_user:app_password@localhost:5432/library
          AUTH_DATABASE_URL: postgresql+psycopg2://app_user:app_password@localhost:5432/users
          SECRET_KEY: test-secret-key
        run: python3 -m pytest --cov=app --cov-fail-under=40

  migrate:
    runs-on: self-hosted
    needs: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install --break-system-packages -r requirements.txt
      - name: Check migrations
        env:
          DATABASE_URL: postgresql+psycopg2://app_user:app_password@localhost:5432/library
          AUTH_DATABASE_URL: postgresql+psycopg2://app_user:app_password@localhost:5432/users
          SECRET_KEY: test-secret-key
        run: python3 -m alembic upgrade head

  build-and-publish:
    runs-on: self-hosted
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build --no-cache -t library-app:${{ github.sha }} .
      - name: Security scan of image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'library-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}
      - name: Push Docker image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag library-app:${{ github.sha }} ghcr.io/$REPO_LOWER/library-app:${{ github.sha }}
          docker push ghcr.io/$REPO_LOWER/library-app:${{ github.sha }}