name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег образа для деплоя (например, v0.6.0 или sha)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Flake8
        run: flake8 . --max-line-length=120 --extend-ignore=E402 --exclude=.venv,tests/__pycache__,migrations
      - name: Run Bandit (SAST)
        run: bandit -r . -x ./.venv,./tests,./migrations -q

  test:
    runs-on: self-hosted
    needs: lint
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install --break-system-packages -r requirements.txt
      - name: Run Tests
        env:
          DATABASE_URL: postgresql+psycopg2://app_user:app_password@localhost:5432/library
          AUTH_DATABASE_URL: postgresql+psycopg2://app_user:app_password@localhost:5432/users
          SECRET_KEY: test-secret-key
        run: python3 -m pytest --cov=app --cov-fail-under=40

  migrate:
    runs-on: self-hosted
    needs: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install --break-system-packages -r requirements.txt
      - name: Check migrations
        env:
          DATABASE_URL: postgresql+psycopg2://app_user:app_password@localhost:5432/library
          AUTH_DATABASE_URL: postgresql+psycopg2://app_user:app_password@localhost:5432/users
          SECRET_KEY: test-secret-key
        run: python3 -m alembic upgrade head

  build-and-publish:
    runs-on: self-hosted
    needs: migrate
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Determine tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build Docker image
        run: docker build --no-cache -t library-app:${{ steps.meta.outputs.tag }} .
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-trivy-
      - name: Security scan of image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'library-app:${{ steps.meta.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}
      - name: Push Docker image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/$REPO_LOWER/library-app:${{ steps.meta.outputs.tag }}"
          docker tag library-app:${{ steps.meta.outputs.tag }} $IMAGE_TAG
          
          for i in 1 2 3; do
            echo "Попытка пуша #$i..."
            if docker push $IMAGE_TAG; then
              echo "Пуш успешен!"
              exit 0
            else
              echo "Попытка #$i не удалась. Ждем 10 секунд..."
              sleep 10
            fi
          done
          
          echo "Все попытки пуша провалились."
          exit 1

  deploy:
    runs-on: self-hosted
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy to target server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd /home/appuser/DevOps_CD
            sed -i "s|image: ghcr.io/kaplan-m/devops/library-app:.*|image: ghcr.io/kaplan-m/devops/library-app:${{ needs.build-and-publish.outputs.image_tag }}|" docker-compose.yml
            echo "${{ secrets.GHCR_PUSH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull app
            docker compose up -d --no-build
            sleep 10
            docker compose ps
            curl -f http://localhost:5001/health || exit 1
            curl -f http://localhost:5001/version || exit 1
          EOF